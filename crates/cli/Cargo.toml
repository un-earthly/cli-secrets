[package]
name = "cli"
version = "0.1.0"
edition = "2021"
description = "Rust CLI tool for cli-secrets vault synchronization"

[dependencies]
clap = { version = "4.6.4", features = ["derive", "env"] }
reqwest = { version = "0.13.4", features = ["json"] }
tokio = { version = "1.53.1", features = ["full"] }
crypto = { path = "../crypto" }
thiserror = "2.0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
