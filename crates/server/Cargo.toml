[package]
name = "server"
version = "0.1.0"
edition = "2021"
description = "Axum REST API server for cli-secrets vault storage"

[dependencies]
axum = "0.8.9"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "chrono"] }
tokio = { version = "1.53.1", features = ["full"] }
argon2 = "0.5.3"
tower-http = { version = "0.6.2", features = ["cors", "trace", "fs"] }
crypto = { path = "../crypto" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.19"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
